[project]
name = "rsna-knee"
version = "0.1.0"
description = "Multi-label abnormality detection on knee MRI (RSNA Kaggle challenge)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "langdetect",
    "pydicom>=3.0.2",
    "pylibjpeg>=2.1.0",
    "pylibjpeg-openjpeg>=2.6.0",
    "pylibjpeg-libjpeg>=2.4.0",
    "iterative-stratification>=0.1.9",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "opencv-python-headless>=5.0.0.93",
    "torch>=2.14.1",
    "timm>=1.0.30",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
    "nbclient",
    "nbformat",
    "nbstripout>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsna_knee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
