[project]
name = "rsna-knee"
version = "0.1.0"
description = "Multi-label abnormality detection on knee MRI (RSNA Kaggle challenge)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "langdetect",
    "pydicom>=3.0.2",
    "pylibjpeg>=2.1.0",
    "pylibjpeg-openjpeg>=2.6.0",
    "pylibjpeg-libjpeg>=2.4.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "nbclient",
    "nbformat",
    "nbstripout>=0.9.1",
]
